<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAHAF GALLERY</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ffe6f0, #ffe0b2);
            color: #222;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        h1 {
            margin-top: 30px;
            font-size: 54px;
            color: #ff416c;
            text-shadow: 3px 3px 15px rgba(0, 0, 0, 0.4);
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .gallery img {
            width: 100%;
            height: 260px;
            object-fit: cover;
            border-radius: 20px;
            border: 3px solid transparent;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.5);
            transition: 0.3s;
            cursor: pointer;
        }

        .gallery img:hover {
            transform: scale(1.1) rotate(1deg);
            box-shadow: 0 20px 50px rgba(255, 65, 108, 0.8);
            border: 3px solid #ff416c;
            filter: brightness(1.2) saturate(1.3);
        }

        .bnt {
            margin: 20px 0 50px 0;
            padding: 20px 60px;
            font-size: 24px;
            font-weight: bold;
            background: linear-gradient(90deg, #ff416c, #ff4b2b);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 15px 40px rgba(255, 65, 108, 0.7);
            transition: 0.3s;
        }

        .bnt:hover {
            transform: scale(1.15) translateY(-3px);
            box-shadow: 0 25px 55px rgba(255, 65, 108, 0.9);
        }

        /* COMMENTS */
        .comment-section {
            max-width: 800px;
            margin: 50px auto 60px auto;
            text-align: left;
            background: #fff;
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 0 45px rgba(255, 65, 108, 0.5);
        }

        .comment-section h2 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 28px;
            color: #ff416c;
        }

        input[type=text],
        textarea {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border: 2px solid #ff416c;
            border-radius: 15px;
            font-size: 16px;
            outline: none;
        }

        input:focus,
        textarea:focus {
            border-color: #ff4b2b;
            box-shadow: 0 0 20px rgba(255, 65, 108, 0.5);
        }

        button.post {
            padding: 14px 30px;
            background: linear-gradient(90deg, #ff416c, #ff4b2b);
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 12px 35px rgba(255, 65, 108, 0.7);
            transition: 0.3s;
        }

        button.post:hover {
            transform: scale(1.08) translateY(-2px);
            box-shadow: 0 20px 50px rgba(255, 65, 108, 0.9);
        }

        .comment {
            background: #f7f7f7;
            border-radius: 15px;
            padding: 14px;
            margin-top: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
            border-left: 5px solid #ff416c;
        }

        .name {
            font-weight: bold;
            color: #ff416c;
        }

        .time {
            font-size: 12px;
            color: #777;
        }

        .text {
            margin-top: 5px;
            white-space: pre-wrap;
        }

        .developed-by {
            margin-top: 50px;
            font-size: 20px;
            color: #ff7f50;
            text-shadow: 1px 1px 2px #000;
        }
    </style>
</head>

<body>

    <h1>RAHAF GALLERY</h1>

    <div class="gallery">
        <img src="r1.jpg">
        <img src="r2.jpg">
        <img src="r3.jpg">
        <img src="r4.jpg">
        <img src="r5.jpg">
        <img src="r6.jpg">
    </div>

    <a href="https://t.me/Rahaf_7320"><button class="bnt">Telegram</button></a>

    <div class="comment-section">
        <h2>💬 Leave a Comment</h2>
        <input type="text" id="name" placeholder="Your name (optional)">
        <textarea id="comment" placeholder="Write your comment..." maxlength="500"></textarea>
        <button class="post" id="postBtn">Post Comment</button>
        <div id="comments"></div>
    </div>

    <p class="developed-by">Developed by MUHAMMED JEMAL & ABDULHAKEM HASEN</p>

    <script>
        const STORAGE_KEY = "rahaf_comments_public";
        const nameInput = document.getElementById("name");
        const commentInput = document.getElementById("comment");
        const postBtn = document.getElementById("postBtn");
        const commentsWrap = document.getElementById("comments");
        let comments = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");

        function escapeHtml(text) {
            return text.replace(/[&<>"']/g, m => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                "\"": "&quot;",
                "'": "&#039;"
            }[m]));
        }

        function timeAgo(ts) {
            const diff = Date.now() - ts;
            const sec = Math.floor(diff / 1000);
            if (sec < 60) return sec + "s ago";
            const min = Math.floor(sec / 60);
            if (min < 60) return min + "m ago";
            const hr = Math.floor(min / 60);
            if (hr < 24) return hr + "h ago";
            const d = Math.floor(hr / 24);
            return d + "d ago";
        }

        function renderComments() {
            commentsWrap.innerHTML = "";
            if (comments.length === 0) {
                commentsWrap.innerHTML = "<p style='color:#777;text-align:center;'>No comments yet — be the first!</p>";
                return;
            }
            comments.slice().reverse().forEach(c => {
                const div = document.createElement("div");
                div.className = "comment";
                div.innerHTML = `
                    <div class="name">${escapeHtml(c.name || "Anonymous")}</div>
                    <div class="time">${timeAgo(c.ts)}</div>
                    <div class="text">${escapeHtml(c.text)}</div>
                `;
                commentsWrap.appendChild(div);
            });
        }

        postBtn.addEventListener("click", () => {
            const text = commentInput.value.trim();
            if (!text) return;

            const newComment = {
                name: nameInput.value.trim(),
                text,
                ts: Date.now()
            };

            comments.push(newComment);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(comments));
            renderComments();
            commentInput.value = "";
        });

        renderComments();
    </script>

</body>

</html>
